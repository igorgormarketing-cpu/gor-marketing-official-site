<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="44" height="44">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Diamond/cube shape - top face -->
  <polygon points="50,8 80,28 50,48 20,28" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- Left face -->
  <polygon points="20,28 50,48 50,78 20,58" fill="none" stroke="url(#g2)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- Right face -->
  <polygon points="80,28 50,48 50,78 80,58" fill="none" stroke="url(#g3)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- Inner lines for depth -->
  <line x1="50" y1="8" x2="50" y2="48" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="28" x2="80" y2="28" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="48" x2="50" y2="78" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <!-- Glow dots at vertices -->
  <circle cx="50" cy="8" r="2.5" fill="#f472b6" opacity="0.9"/>
  <circle cx="80" cy="28" r="2" fill="#a855f7" opacity="0.8"/>
  <circle cx="20" cy="28" r="2" fill="#60a5fa" opacity="0.8"/>
  <circle cx="50" cy="48" r="3" fill="#7c3aed" opacity="0.9"/>
  <circle cx="50" cy="78" r="2.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="80" cy="58" r="2" fill="#60a5fa" opacity="0.7"/>
  <circle cx="20" cy="58" r="2" fill="#a855f7" opacity="0.7"/>
</svg>